{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - J_Challoh Creatives</title>
    <link rel="stylesheet" href="{% static 'payments/style.css' %}">
</head>
<body>
    <div class="checkout-container">
        <div class="summary-section">
            <div class="summary-content">
                <div class="logo-icon">
                    <div class="bar bar1"></div>
                    <div class="bar bar2"></div>
                    <div class="bar bar3"></div>
                </div>
                
                <h1 class="main-title">AI MASTERY PROGRAM</h1>
                <p class="subtitle">BY J_Challoh Creatives</p>
                <p>Unlock your potential, Start learning AI with us today.</p>
                
            </div>

            <div class="payment-footer">
                <div class="secured-wrapper">
                <p class="secured-by">🛡️ Secured by <b>paystack</b></p>
                </div>
                <div class="icon-box">
                    <img src="{% static 'payments/images/mpesa.png' %}" alt="M-PESA" class="footer-logo">
                    <img src="{% static 'payments/images/visa.png' %}" alt="Visa" class="footer-logo">
                    <img src="{% static 'payments/images/mastercard.jpg' %}" alt="Mastercard" class="footer-logo">
                    <img src="{% static 'payments/images/airtel.webp' %}" alt="Airtel" class="footer-logo">
                  
                </div>
            </div>

        </div>

        <div class="form-section">
            <form id="paymentForm"> 
                {% csrf_token %}
                <div class="input-row">
                    <div class="input-group">
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" required placeholder="John">
                    </div>
                    <div class="input-group">
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" required placeholder="Doe">
                    </div>
                </div>

                <div class="input-group">
                    <label for="email-address">Email Address</label>
                    <input type="email" id="email-address" required placeholder="email@example.com">
                </div>

                <div class="input-group">
                    <label for="phone-number">Phone Number</label>
                    <input type="tel" id="phone-number" required placeholder="0712 345 678">
                </div>

                <div class="input-group">
                    <label for="amount">Amount</label>
                    <div class="amount-wrapper">
                        <span class="kes-prefix">KES</span>
                        <input type="number" id="amount" name="amount" value="1000" min="1" required>
                    </div>
                </div>
                
                <button type="submit" class="pay-btn">Pay now</button>
            </form>
        </div>
    </div>

    <script src="https://js.paystack.co/v2/inline.js"></script>

    <script>
    const paymentForm = document.getElementById('paymentForm');
    
    paymentForm.addEventListener("submit", function(e) {
        e.preventDefault(); 

        // 1. Grab current values from the form inputs
        const email = document.getElementById("email-address").value;
        const amount = document.getElementById("amount").value;
        const phone = document.getElementById("phone-number").value;
        const firstName = document.getElementById("first-name").value;

        // 2. Initialize Paystack
        const paystack = new PaystackPop();

        paystack.newTransaction({
            key: '{{ public_key }}', 
            email: email,
            amount: Number(amount) * 100, // Converts KES to Cents (Paystack requirement)
            currency: 'KES',
            metadata: {
                custom_fields: [
                    {
                        display_name: "First Name",
                        variable_name: "first_name",
                        value: firstName
                    },
                    {
                        display_name: "Mobile Number",
                        variable_name: "mobile_number",
                        value: phone
                    }
                ]
            },

            onSuccess: (transaction) => {
                // 3. Prepare the Success URL with parameters
                const successUrl = "{% url 'payment-success' %}";
                const params = new URLSearchParams({
                    ref: transaction.reference,
                    email: email,
                    amount: amount,
                    first_name: firstName
                });
                
                // 4. Redirect to the receipt page
                window.location.href = `${successUrl}?${params.toString()}`;
            },

            onCancel: () => {
                alert("Payment cancelled. Feel free to try again!");
            }
        });
    });
</script>
</body>
</html>
